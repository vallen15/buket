<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ebf5fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>UNTUK MU SAYANGKU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           RESET & CSS VARIABLES
           ========================================================================== */
        :root {
            --bg-center: #ffffff;
            --bg-mid: #ebf5fa;
            --bg-outer: #d5e7f2;
            --navy-dark: #0c2340;
            --navy-mid: #15365c;
            --navy-sub: #1b4066;
            --anti-gravity-duration: 6.2s;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background: radial-gradient(circle at 50% 38%, var(--bg-center) 0%, var(--bg-mid) 54%, var(--bg-outer) 100%);
            color: var(--navy-dark);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           MAIN POSTER CONTAINER (1024x559 aspect ratio)
           ========================================================================== */
        .stage-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }

        /* REPLAY INTRO FLOATING BUTTON */
        .replay-btn {
            position: fixed;
            top: 1.25rem;
            right: 1.5rem;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.15rem;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(223, 182, 88, 0.45);
            border-radius: 999px;
            color: var(--navy-dark);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(12, 35, 64, 0.08), 0 1px 3px rgba(223, 182, 88, 0.2);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
        }

        .replay-btn:hover {
            background: #ffffff;
            border-color: #dfb658;
            color: #b57a1e;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 26px rgba(223, 182, 88, 0.38), 0 2px 6px rgba(12, 35, 64, 0.1);
        }

        .replay-btn:active {
            transform: translateY(0px) scale(0.97);
        }

        .replay-icon {
            transition: transform 0.4s ease;
        }

        .replay-btn:hover .replay-icon {
            transform: rotate(-180deg);
        }

        /* MOBILE RESPONSIVE TWEAKS FOR ANDROID & IPHONE */
        @media (max-width: 650px), (max-aspect-ratio: 1/1) {
            .replay-btn {
                top: max(0.85rem, env(safe-area-inset-top, 0.85rem));
                right: max(0.85rem, env(safe-area-inset-right, 0.85rem));
                padding: 0.45rem 0.85rem;
                font-size: 0.74rem;
                gap: 0.35rem;
            }
            .replay-btn .btn-text-desktop {
                display: none;
            }
            .replay-btn .btn-text-mobile {
                display: inline;
            }
        }

        @media (min-width: 651px) and (min-aspect-ratio: 1/1) {
            .replay-btn .btn-text-mobile {
                display: none;
            }
        }

        /* SVG ARTWORK WRAPPER */
        .artwork-wrapper {
            position: relative;
            width: 96vw;
            max-width: 1024px;
            max-height: 92vh;
            aspect-ratio: 1024 / 559;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            will-change: transform;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .main-svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* ==========================================================================
           CINEMATIC MULTI-STAGE INTRO ANIMATION SUITE
           ========================================================================== */

        /* 1. BLUEPRINT GRID TRACING (Genesis Phase) */
        .play-intro #blueprintGrid {
            animation: introGridFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes introGridFade {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 0.88;
                transform: scale(1);
            }
        }

        .play-intro .blueprint-line {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: traceBlueprintLine 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes traceBlueprintLine {
            0% { stroke-dashoffset: 600; opacity: 0; }
            30% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }

        .play-intro .blueprint-marker {
            opacity: 0;
            transform-origin: center;
            animation: popBlueprintMarker 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
        }

        @keyframes popBlueprintMarker {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 2. STEMS GENERATIVE GROWTH */
        .play-intro #bouquetStems {
            transform-origin: 508px 285px;
            animation: growBouquetStems 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }

        @keyframes growBouquetStems {
            0% {
                transform: scaleY(0);
                opacity: 0;
            }
            60% {
                opacity: 1;
            }
            100% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        /* 3. LEAF UNFURLING */
        .play-intro .leaf-unfurl-1 {
            animation: leafUnfurl 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
        }
        .play-intro .leaf-unfurl-2 {
            animation: leafUnfurl 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both;
        }
        .play-intro .leaf-unfurl-3 {
            animation: leafUnfurl 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s both;
        }

        @keyframes leafUnfurl {
            0% {
                transform: scale(0) rotate(-22deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.16) rotate(4deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* 4. CHALICE WRAPPER ORIGAMI UNFOLDING */
        .play-intro #wrapperBack {
            transform-origin: 508px 368px;
            animation: unfoldBackWrapper 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) 0.2s both;
        }

        @keyframes unfoldBackWrapper {
            0% {
                transform: scale(0.7, 0.4) translateY(24px);
                opacity: 0;
            }
            100% {
                transform: scale(1, 1) translateY(0);
                opacity: 1;
            }
        }

        .play-intro #wrapperFrontCone {
            transform-origin: 508px 368px;
            animation: unfoldFrontWrapper 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) 0.3s both;
        }

        @keyframes unfoldFrontWrapper {
            0% {
                transform: scale(0.75, 0.5) translateY(20px);
                opacity: 0;
            }
            70% {
                transform: scale(1.04, 1.02) translateY(-2px);
                opacity: 1;
            }
            100% {
                transform: scale(1, 1) translateY(0);
                opacity: 1;
            }
        }

        /* 5. STAGGERED ROSE BLOOMS (ELASTIC SPRING & PETAL ROTATION) */
        .play-intro .bloom-rose-top {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.20s both;
        }
        .play-intro .bloom-rose-ul {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.26s both;
        }
        .play-intro .bloom-rose-ur {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.32s both;
        }
        .play-intro .bloom-rose-sl {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.38s both;
        }
        .play-intro .bloom-rose-sr {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.44s both;
        }
        .play-intro .bloom-rose-ll {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.50s both;
        }
        .play-intro .bloom-rose-lr {
            animation: bloomRoseSpring 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.56s both;
        }
        /* Foremost Center Master Rose */
        .play-intro .bloom-rose-center {
            animation: bloomRoseCenterMaster 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.64s both;
        }

        @keyframes bloomRoseSpring {
            0% {
                transform: scale(0) rotate(-35deg);
                opacity: 0;
            }
            65% {
                transform: scale(1.15) rotate(6deg);
                opacity: 1;
            }
            85% {
                transform: scale(0.96) rotate(-2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes bloomRoseCenterMaster {
            0% {
                transform: scale(0) rotate(-55deg);
                opacity: 0;
                filter: drop-shadow(0 0 0 rgba(223, 67, 116, 0));
            }
            60% {
                transform: scale(1.22) rotate(8deg);
                opacity: 1;
                filter: drop-shadow(0 0 24px rgba(223, 67, 116, 0.65));
            }
            82% {
                transform: scale(0.95) rotate(-3deg);
                filter: drop-shadow(0 0 10px rgba(223, 67, 116, 0.25));
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                filter: drop-shadow(0 0 0 rgba(223, 67, 116, 0));
            }
        }

        /* 6. LUXURY RIBBON BOW & RUBY GEM POP */
        .play-intro #ribbonBow {
            transform-origin: 508px 376px;
            animation: popRibbonBow 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.72s both;
        }

        @keyframes popRibbonBow {
            0% {
                transform: scale(0) translateY(12px);
                opacity: 0;
            }
            60% {
                transform: scale(1.24) translateY(-3px);
                opacity: 1;
            }
            82% {
                transform: scale(0.94) translateY(1px);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* 7. GROUND SHADOW BREATHING ENTRANCE */
        .play-intro .ground-shadow {
            animation: shadowIntroFade 0.6s ease-out 0.4s both, pulseShadow var(--anti-gravity-duration) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite 1.4s;
        }

        @keyframes shadowIntroFade {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            100% {
                opacity: 0.25;
                transform: scale(1);
            }
        }

        /* 8. TYPOGRAPHY KINETIC REVEAL */
        .play-intro #textLine1 {
            animation: revealTypoLine1 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both;
        }

        @keyframes revealTypoLine1 {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
                letter-spacing: 1px;
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .play-intro #textLine2 {
            animation: revealTypoLine2 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.88s both;
        }

        @keyframes revealTypoLine2 {
            0% {
                opacity: 0;
                transform: translateY(12px);
                letter-spacing: 4px;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 9px;
            }
        }

        /* ==========================================================================
           CONTINUOUS ANTI-GRAVITY FLOATING (Begins after intro handoff)
           ========================================================================== */
        .anti-gravity-float {
            transform-origin: 508px 270px;
            animation: floatBouquet var(--anti-gravity-duration) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            animation-delay: 2.5s;
            will-change: transform;
            cursor: pointer;
        }

        @keyframes floatBouquet {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            33% {
                transform: translateY(-9px) rotate(-0.5deg);
            }
            66% {
                transform: translateY(-16px) rotate(0.45deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        /* GROUND SHADOW PULSING IN INVERSE TO HEIGHT */
        .ground-shadow {
            transform-origin: 508px 460px;
            will-change: transform, opacity;
        }

        @keyframes pulseShadow {
            0% {
                transform: scale(1);
                opacity: 0.25;
            }
            50% {
                transform: scale(0.85, 0.82);
                opacity: 0.14;
            }
            100% {
                transform: scale(1);
                opacity: 0.25;
            }
        }

        /* BOUNCE ON CLICK */
        .bounce-click {
            animation: bounceAnim 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }

        @keyframes bounceAnim {
            0% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-24px) scale(1.03); }
            50% { transform: translateY(5px) scale(0.98); }
            75% { transform: translateY(-5px) scale(1.01); }
            100% { transform: translateY(0) scale(1); }
        }

        /* GLOW PARTICLES (GENERATIVE SPAWNER) */
        .particle-sparkle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,215,100,0.6) 60%, transparent 100%);
            animation: floatUpParticle 1.4s ease-out forwards;
        }

        @keyframes floatUpParticle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--p-dx), var(--p-dy)) scale(0.2);
            }
        }
    </style>
</head>

<!-- REPLAY BUTTON -->
<button class="replay-btn" id="replayBtn" title="Putar Ulang Animasi Awal">
    <svg class="replay-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

<div class="stage-container play-intro" id="stageContainer">
    <div class="artwork-wrapper" id="artworkWrapper">

            </defs>

            <!-- ====================================================================
                 LAYER 1: BLUEPRINT TECHNICAL GRID & CONSTRUCTION MARKS
                 ==================================================================== -->

                    M 345 60 L 680 60

<!-- ==========================================================================
     INTERACTIVE JAVASCRIPT: INTRO REPLAY, 3D PARALLAX, BOUNCE & PARTICLES
     ========================================================================== -->
<script>
(function() {
    const stage = document.getElementById('stageContainer');
    const wrapper = document.getElementById('artworkWrapper');
    const bouquet = document.getElementById('interactiveBouquet');
    const replayBtn = document.getElementById('replayBtn');

    // Replay Intro Handler
    function replayIntro() {
        stage.classList.remove('play-intro');
        void stage.offsetWidth; // Force DOM reflow to re-trigger animations
        stage.classList.add('play-intro');

        // Burst celebration sparkle on intro completion
        setTimeout(() => {
            const rect = wrapper.getBoundingClientRect();
            const cx = rect.left + rect.width * 0.496;
            const cy = rect.top + rect.height * 0.29;
            for (let i = 0; i < 24; i++) {
                createSparkle(cx, cy);
            }
        }, 1100);
    }

    replayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        replayIntro();
    });

    // Keyboard shortcut (R or Space to replay)
    window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R' || e.code === 'Space') {
            if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                replayIntro();
            }
        }
    });

    // Trigger initial celebration sparkle when Rose 4 finishes blooming
    setTimeout(() => {
        const rect = wrapper.getBoundingClientRect();
        const cx = rect.left + rect.width * 0.496;
        const cy = rect.top + rect.height * 0.29;
        for (let i = 0; i < 20; i++) {
            createSparkle(cx, cy);
        }
    }, 1100);

    // 1. Responsive Scale for Mobile (Android & iPhone) and Desktop
    function getResponsiveScale() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const ratio = w / h;
        if (ratio < 0.62) {
            // Typical smartphone portrait (iPhone, Android)
            return 1.84;
        } else if (ratio < 0.85) {
            // Wider phone or small tablet portrait
            return 1.55;
        } else if (ratio < 1.05) {
            // iPad / Tablet
            return 1.30;
        } else if (h < 540) {
            // Landscape mobile phone
            return Math.min(1.0, (h * 0.86) / 559);
        }
        return 1.0;
    }

    let baseScale = getResponsiveScale();
    window.addEventListener('resize', () => {
        baseScale = getResponsiveScale();
    });

    // 2. 3D Parallax with Lerp (Mouse, Touch & Gyroscope)
    let targetRotX = 0, targetRotY = 0;
    let currentRotX = 0, currentRotY = 0;
    let isTouching = false;
    let hasGyro = false;

    // Desktop Mouse
    window.addEventListener('mousemove', (e) => {
        if (isTouching) return;
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const dx = (e.clientX - cx) / cx;
        const dy = (e.clientY - cy) / cy;

        targetRotY = dx * 8.5;
        targetRotX = -dy * 7.0;
    });

    // Mobile Touch Drag Parallax (Android & iPhone)
    window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isTouching = true;
        }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (isTouching && e.touches.length === 1) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const dx = (e.touches[0].clientX - cx) / cx;
            const dy = (e.touches[0].clientY - cy) / cy;

            targetRotY = dx * 11.0;
            targetRotX = -dy * 9.0;
        }
    }, { passive: true });

    window.addEventListener('touchend', () => {
        isTouching = false;
        if (!hasGyro) {
            targetRotX = 0;
            targetRotY = 0;
        }
    }, { passive: true });

    // Mobile Gyroscope / Device Orientation (Android & iPhone)
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null && !isTouching) {
                hasGyro = true;
                const gamma = Math.max(-28, Math.min(28, e.gamma));
                const beta = Math.max(15, Math.min(65, e.beta)) - 40;

                targetRotY = (gamma / 28) * 9.0;
                targetRotX = -(beta / 25) * 7.5;
            }
        }, { passive: true });
    }

    function updateParallax() {
        currentRotX += (targetRotX - currentRotX) * 0.08;
        currentRotY += (targetRotY - currentRotY) * 0.08;

        wrapper.style.transform = `scale(${baseScale}) rotateX(${currentRotX.toFixed(2)}deg) rotateY(${currentRotY.toFixed(2)}deg)`;
        requestAnimationFrame(updateParallax);
    }
    updateParallax();

    // 3. Elastic Bounce & Magical Particles (Mouse Click & Touch Tap)
    let lastTap = 0;
    function triggerBounceInteraction(clientX, clientY) {
        const now = Date.now();
        if (now - lastTap < 320) return;
        lastTap = now;

        bouquet.classList.remove('bounce-click');
        void bouquet.offsetWidth;
        bouquet.classList.add('bounce-click');

        for (let i = 0; i < 18; i++) {
            createSparkle(clientX, clientY);
        }
    }

    bouquet.addEventListener('click', (e) => {
        const rect = wrapper.getBoundingClientRect();
        triggerBounceInteraction(e.clientX || (rect.left + rect.width / 2), e.clientY || (rect.top + rect.height * 0.4));
    });

    bouquet.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            triggerBounceInteraction(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    function createSparkle(x, y) {
        const p = document.createElement('div');
        p.className = 'particle-sparkle';
        const size = Math.random() * 9 + 4;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (x - size / 2) + 'px';
        p.style.top = (y - size / 2) + 'px';

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 90 + 35;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed - 45;

        p.style.setProperty('--p-dx', dx + 'px');
        p.style.setProperty('--p-dy', dy + 'px');

        document.body.appendChild(p);
        setTimeout(() => {
            p.remove();
        }, 1400);
    }
})();
</script>
